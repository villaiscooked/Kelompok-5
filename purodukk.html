        <h2>PENGINGAT TUGAS</h2>

        <label>Nama Tugas:</label><br>
        <input type="text" id="tugas"><br><br>

        <label>Jam Pengingat (HH:MM):</label><br>
        <input type="time" id="jam"><br><br>

        <button onclick="cekPengingat()">Cek Pengingat</button>

        <p id="hasil"></p>

        <script>
                function cekPengingat() 
                {
                let tugas = document.getElementById("tugas").value;
                let jamPengingat = document.getElementById("jam").value;

                // Ambil jam sekarang
                let sekarang = new Date();
                let jamSekarang =
                    String(sekarang.getHours()).padStart(2, '0') + ":" +
                    String(sekarang.getMinutes()).padStart(2, '0');

                let hasil = document.getElementById("hasil");

                if (jamSekarang === jamPengingat) {
                    hasil.innerHTML = "⏰ PENGINGAT! Segera kerjakan tugas: <b>" + tugas + "</b>";
                }
                else {
                    hasil.innerHTML = "Belum waktunya pengingat.<br>Jam sekarang: " + jamSekarang;
                }
                }
        </script>
        </ul>
    </body>
